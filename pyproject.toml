[project]
name = "readablemusic"
version = "0.1.0"
description = "Turn poorly scanned a cappella sheet music into MusicXML and PDF, with Hebrew and English lyrics."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Amit Rappel", email = "amitrappel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "music21>=10.5.1",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.32",
    "reportlab>=5.1.0",
    "svglib>=2.3.2",
    "uvicorn>=0.54.0",
    "verovio>=6.3.0",
]

[project.scripts]
readablemusic = "readablemusic:main"
readablemusic-web = "readablemusic.web:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pymupdf>=2.0",
    "pytest>=9.1.1",
    "resvg-py>=0.5.0",
]
